<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FARU door check-in</title>
  <meta name="description" content="Open FARU to show your door check-in code for this event." />
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://www.improvestu.com/faru/attend/" />
  <style>
    :root {
      --bg: #0b1220;
      --fg: #f4f7fb;
      --muted: #9aa8bc;
      --cyan: #3ecfef;
      --card: #121a2b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #1a2740, var(--bg));
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main {
      width: min(420px, 100%);
      background: var(--card);
      border-radius: 16px;
      padding: 28px 24px;
      text-align: center;
    }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    p { color: var(--muted); line-height: 1.45; margin: 0 0 16px; }
    a.btn {
      display: inline-block;
      background: var(--cyan);
      color: #041018;
      font-weight: 700;
      text-decoration: none;
      padding: 12px 18px;
      border-radius: 999px;
      margin: 6px 4px;
    }
    a.secondary {
      color: var(--cyan);
      display: inline-block;
      margin-top: 10px;
    }
    .err { color: #ff8f8f; }
  </style>
</head>
<body>
  <main>
    <h1>Door check-in</h1>
    <p id="msg">Opening FARU…</p>
    <p id="actions" hidden></p>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var hub = (params.get('hub') || params.get('h') || '').trim();
      if (!hub) {
        var parts = location.pathname.split('/').filter(Boolean);
        var i = parts.indexOf('attend');
        if (i >= 0 && parts[i + 1] && parts[i + 1] !== 'index.html') {
          hub = parts[i + 1];
        }
      }
      var msg = document.getElementById('msg');
      var actions = document.getElementById('actions');
      if (!hub) {
        msg.className = 'err';
        msg.textContent = 'This door link is missing the event. Ask an officer for the hub QR again.';
        return;
      }
      var deep = 'faru://attend/' + encodeURIComponent(hub);
      var store = 'https://www.improvestu.com/faru/';
      msg.textContent = 'If FARU is installed, your door code screen should open. If nothing happens, tap Open in FARU.';
      actions.hidden = false;
      actions.innerHTML =
        '<a class="btn" href="' + deep + '">Open in FARU</a>' +
        '<div><a class="secondary" href="' + store + '">Get FARU</a></div>';
      // Try to hand off to the app immediately (works when FARU is installed).
      window.location.replace(deep);
    })();
  </script>
</body>
</html>
