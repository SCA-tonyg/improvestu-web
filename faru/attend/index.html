<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FARU door check-in</title>
  <meta name="description" content="Open FARU to check in for this event." />
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://www.improvestu.com/faru/attend/" />
  <style>
    :root {
      --bg: #0b1220;
      --fg: #f4f7fb;
      --muted: #9aa8bc;
      --cyan: #3ecfef;
      --card: #121a2b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #1a2740, var(--bg));
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main {
      width: min(420px, 100%);
      background: var(--card);
      border-radius: 16px;
      padding: 28px 24px;
      text-align: center;
    }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    p { color: var(--muted); line-height: 1.45; margin: 0 0 16px; }
    button.btn, a.btn {
      display: inline-block;
      background: var(--cyan);
      color: #041018;
      font-weight: 700;
      text-decoration: none;
      border: 0;
      cursor: pointer;
      font-size: 1rem;
      padding: 14px 20px;
      border-radius: 999px;
      margin: 6px 4px;
    }
    a.secondary {
      color: var(--cyan);
      display: inline-block;
      margin-top: 14px;
    }
    .err { color: #ff8f8f; }
  </style>
</head>
<body>
  <main>
    <h1>Event check-in</h1>
    <p id="msg">Loading…</p>
    <div id="actions" hidden></div>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var hub = (params.get('hub') || params.get('h') || '').trim();
      if (!hub) {
        var parts = location.pathname.split('/').filter(Boolean);
        var i = parts.indexOf('attend');
        if (i >= 0 && parts[i + 1] && parts[i + 1] !== 'index.html') {
          hub = parts[i + 1];
        }
      }
      var msg = document.getElementById('msg');
      var actions = document.getElementById('actions');
      if (!hub) {
        msg.className = 'err';
        msg.textContent = 'This door link is missing the event. Ask an officer for the hub QR again.';
        return;
      }

      var ua = navigator.userAgent || '';
      var isAndroid = /Android/i.test(ua);
      var deep = 'faru://attend/' + encodeURIComponent(hub);
      var play = 'https://play.google.com/store/apps/details?id=com.faru.faru';
      var site = 'https://www.improvestu.com/faru/';
      // Explicit VIEW + BROWSABLE so Chrome delivers faru://attend/<hub> (same
      // route as Club Member check-in), not a bare package launch to Home.
      var intent =
        'intent://attend/' + encodeURIComponent(hub) +
        '#Intent;scheme=faru;package=com.faru.faru;' +
        'action=android.intent.action.VIEW;' +
        'category=android.intent.category.BROWSABLE;' +
        'S.browser_fallback_url=' + encodeURIComponent(play) + ';end';

      function openFaru() {
        if (isAndroid) {
          window.location.href = intent;
          return;
        }
        var start = Date.now();
        window.location.href = deep;
        setTimeout(function () {
          if (Date.now() - start < 2000 && document.visibilityState === 'visible') {
            window.location.href = site;
          }
        }, 1600);
      }

      msg.textContent = 'Opening FARU event check-in… You need the FARU app signed in on this phone.';
      actions.hidden = false;
      actions.innerHTML =
        '<button type="button" class="btn" id="openBtn">Open event check-in</button>' +
        '<div><a class="secondary" href="' + (isAndroid ? play : site) + '">Get FARU</a></div>';
      document.getElementById('openBtn').addEventListener('click', function (e) {
        e.preventDefault();
        openFaru();
      });

      if (isAndroid) {
        setTimeout(openFaru, 200);
      } else {
        setTimeout(openFaru, 400);
      }
    })();
  </script>
</body>
</html>
